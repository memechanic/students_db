{% extends 'base.html' %}
{% block title %}Рейтинг{% endblock title %}
{% block content %}
    <div class="container bg-body p-4">
        <div class="row">
            <table class="table table-bordered">
                <thead>
                    <tr class="table-primary">
                        <th>#</th>
                        <th>Пользователь</th>
                        <th>Рейтинг</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ u.username }}</td>
                            <td>{{ u.rating }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock content %}
