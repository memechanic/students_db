[project]
name = "web"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "sqlmodel>=0.0.48",
    "pillow>=13.0.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
line-length = 100

[tool.djlint]
ignore = "H021"
quote_style = "single"

[dependency-groups]
dev = ["djlint>=1.46.4", "ruff>=0.16.9"]
